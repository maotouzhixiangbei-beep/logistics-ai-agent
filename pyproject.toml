[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logistics-ai-agent"
version = "0.1.0"
description = "A Pydantic AI agent that answers logistics questions by calling WMS/OMS/TMS business APIs via function calling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
